{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris Cycle</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body { font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        header { background: #002b4c; color: white; padding: 1rem; text-align: center; }
        #map { height: 500px; width: 100%; }
        .news-container { padding: 20px; display: flex; gap: 20px; flex-wrap: wrap; }
        .news-card { border: 1px solid #ddd; padding: 10px; width: 300px; }
        .news-card img { width: 100%; height: auto; }

        /* Popup */
        .popup-title { font-weight: bold; color: #002b4c; margin-bottom: 0.4rem; }
        .popup-row { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.85rem; margin-top: 0.3rem; }
        .badge { padding: 2px 8px; border-radius: 12px; font-weight: bold; color: white; }
        .badge-green { background: #2e7d32; }
        .badge-orange { background: #e65100; }
        .badge-blue { background: #1565c0; }
    </style>
</head>
<body>
    <header>
        <h1>PARIS CYCLE</h1>
    </header>

    <!-- CARTE LEAFLET -->
    <div id="map"></div>

    <!-- ACTUALITÉS -->
    <section class="news-container">
        {% for article in articles %}
            <div class="news-card">
                {% if article.image %}
                    <img src="{{ article.image.url }}" alt="{{ article.titre }}">
                {% endif %}
                <h3>{{ article.titre }}</h3>
                <p>{{ article.contenu|truncatewords:20 }}</p>
                <small>{{ article.date_publication|date:"d/m/Y" }}</small>
            </div>
        {% endfor %}
    </section>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const stations = {{ stations_json|safe }};

        const map = L.map('map').setView([48.8566, 2.3522], 13);

        const primaryTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            maxZoom: 20,
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        });

        const fallbackTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });

        primaryTiles.addTo(map);

        primaryTiles.on('tileerror', () => {
            if (map.hasLayer(primaryTiles)) {
                map.removeLayer(primaryTiles);
                fallbackTiles.addTo(map);
            }
        });

        function getColor(available, capacity) {
            if (!capacity) return 'grey';
            const ratio = available / capacity;
            if (ratio > 0.5) return 'green';
            if (ratio > 0.2) return 'orange';
            return 'red';
        }

        function makeIcon(color) {
            return L.divIcon({
                className: '',
                html: `<div style="
                    width: 14px; height: 14px;
                    background: ${color};
                    border: 2px solid white;
                    border-radius: 50%;
                    box-shadow: 0 0 4px rgba(0,0,0,0.4);
                "></div>`,
                iconSize: [14, 14],
                iconAnchor: [7, 7],
            });
        }

        const markerBounds = [];

        stations.forEach(station => {
            const lat = station.coordonnees_geo?.lat;
            const lon = station.coordonnees_geo?.lon;
            if (lat === null || lat === undefined || lon === null || lon === undefined) return;

            const color = getColor(station.numbikesavailable, station.capacity);

            L.marker([lat, lon], { icon: makeIcon(color) })
                .bindPopup(`
                    <div class="popup-title">${station.name}</div>
                    <div style="font-size:0.8rem;color:#666">${station.nom_arrondissement_communes || ''}</div>
                    <div class="popup-row">
                        <span>🚲 Vélos dispo</span>
                        <span class="badge badge-green">${station.numbikesavailable ?? '?'}</span>
                    </div>
                    <div class="popup-row">
                        <span>⚡ Électriques</span>
                        <span class="badge badge-blue">${station.ebike ?? '?'}</span>
                    </div>
                    <div class="popup-row">
                        <span>🔧 Mécaniques</span>
                        <span class="badge badge-orange">${station.mechanical ?? '?'}</span>
                    </div>
                    <div class="popup-row">
                        <span>🅿️ Places libres</span>
                        <span class="badge badge-green">${station.numdocksavailable ?? '?'}</span>
                    </div>
                `)
                .addTo(map);

            markerBounds.push([lat, lon]);
        });

        if (markerBounds.length > 0) {
            map.fitBounds(markerBounds, { padding: [24, 24] });
        }
    </script>
</body>
</html>
