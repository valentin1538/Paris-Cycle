{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris Cycle</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">

    <style>
        body { font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        header { background: #002b4c; color: white; padding: 1rem; text-align: center; }
        #map { height: 400px; width: 100%; background: #eee; }
        .news-container { padding: 20px; display: flex; gap: 20px; flex-wrap: wrap; }
        .news-card { border: 1px solid #ddd; padding: 10px; width: 300px; }
        .news-card img { width: 100%; height: auto; }
    </style>
</head>
<body>
    <header>
        <h1>PARIS CYCLE</h1>
    </header>

    <!-- ZONE CARTE (Pour Membre B) -->
    <div id="map"></div>

    <!-- ZONE ACTUALITÉS (Ton travail) -->
    <section class="news-container">
        {% for article in articles %}
            <div class="news-card">
                {% if article.image %}
                    <img src="{{ article.image.url }}" alt="{{ article.titre }}">
                {% endif %}
                <h3>{{ article.titre }}</h3>
                <p>{{ article.contenu|truncatewords:20 }}</p>
                <small>{{ article.date_publication|date:"d/m/Y" }}</small>
            </div>
        {% endfor %}
    </section>
</body>
</html>
